version: '3.8'

services:
  cricvision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cricvision-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - FORCE_HTTPS=false
      - DATABASE_URL=sqlite:///./cricvision.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - cricvision-data:/app/data
      - ./temp_uploads:/app/temp_uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cricvision-data:
    driver: local
